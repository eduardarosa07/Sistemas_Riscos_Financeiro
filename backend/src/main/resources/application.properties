# ============================================================
# Sistemas Riscos Financeiros
# Backend REST + PostgreSQL
# ============================================================

spring.application.name=Sistemas Riscos Financeiros

# ============================================================
# SERVIDOR
# ============================================================

server.port=${SERVER_PORT:8080}

# ============================================================
# POSTGRESQL
# ============================================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sistema_riscos}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA / HIBERNATE
# ============================================================

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# SESSAO / AUTENTICACAO
# ============================================================

server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ============================================================
# PRIMEIRO ADMINISTRADOR
# ============================================================

app.bootstrap-admin.email=${APP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${APP_ADMIN_PASSWORD:}
app.bootstrap-admin.name=${APP_ADMIN_NAME:Administrador do Sistema}

# ============================================================
# JSON
# ============================================================

spring.jackson.default-property-inclusion=non_null

# ============================================================
# ANGULAR
# ============================================================

app.frontend.origin=${FRONTEND_ORIGIN:http://localhost:4200}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
